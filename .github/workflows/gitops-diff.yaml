on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/gitops-diff.yaml'
      - '.github/create-pr-comment-file.sh'
      - '.github/gitops-diff-comments.py'
      - '.github/tests/test-gitops-diff-comments.py'
      - 'platform-apps/charts/**'
      
permissions:
  contents: read
  pull-requests: write

name: Diff GitOps

concurrency:
  group: gitops-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(vars.GITOPS_DIFF_TESTCASES) }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
         path: pr
      - name: Checkout Target of PR
        uses: actions/checkout@v7
        with:
          path: target
          ref: ${{ github.event.pull_request.base.ref }}

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            appChanges:
              - 'platform-apps/charts/**'

      - name: diff charts
        id: diffStep
        shell: bash
        env:
          CHANGED_APPS: ${{ steps.filter.outputs.appChanges_files }}
        run: |
          bash pr/.github/create-pr-comment-file.sh ${{ matrix.testCase }} ${{ matrix.valuesFiles }} "${{ matrix.setValues }}"

      - uses: actions/upload-artifact@v7
        with:
          name: comment-files-artifact-${{ matrix.testCase }}
          path: comment-files/
          if-no-files-found: ignore

  comment:
    runs-on: ubuntu-latest
    needs: diff
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: comment-files-artifact-*
          path: comment-files/
          merge-multiple: true

      - name: test comment formatter
        run: python3 pr/.github/tests/test-gitops-diff-comments.py

      - name: create comment files
        shell: bash
        run: |
          python3 pr/.github/gitops-diff-comments.py \
            --diff-dir comment-files \
            --output-dir out/comments \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Sync PR comments
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            // Every comment starts with <!-- gitops-diff:<name> -->, where <name> is the
            // comment file name without .md (see .github/gitops-diff-comments.py).
            const markerPattern = /^<!-- gitops-diff:(\S+) -->/;
            const commentDir = "out/comments";
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const issue_number = context.issue.number;

            const names = fs.readdirSync(commentDir)
              .filter((file) => file.endsWith(".md"))
              .map((file) => path.basename(file, ".md"))
              .sort();
            // Create the summary before the chart comments so that it is shown first.
            const orderedNames = names.filter((name) => name === "summary")
              .concat(names.filter((name) => name !== "summary"));
            const wanted = new Map(
              orderedNames.map((name) => [name, fs.readFileSync(path.join(commentDir, `${name}.md`), "utf8")])
            );

            const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number, per_page: 100 });
            for (const comment of comments) {
              const match = comment.user?.login === "github-actions[bot]" && comment.body?.match(markerPattern);
              if (!match) continue;
              const name = match[1];
              if (wanted.has(name)) {
                const body = wanted.get(name);
                if (comment.body !== body) {
                  await github.rest.issues.updateComment({ ...repo, comment_id: comment.id, body });
                  core.info(`Updated comment ${name}`);
                }
                wanted.delete(name);
              } else {
                await github.rest.issues.deleteComment({ ...repo, comment_id: comment.id });
                core.info(`Deleted comment ${name}`);
              }
            }

            for (const [name, body] of wanted) {
              await github.rest.issues.createComment({ ...repo, issue_number, body });
              core.info(`Created comment ${name}`);
            }

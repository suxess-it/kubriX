name: sync upstream release tag with PR

# This runs every day on 1801 UTC
on:
  schedule:
    - cron: '1 18 * * *'
  # Allows manual workflow run (must in default branch to work)
  workflow_dispatch:

# Read the public OSS upstream anonymously; write only to Prime with an App token.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'suxess-it/kubriX-prime' && vars.SYNC_RELEASE_TAG == 'true' }}
    env:
      UPSTREAM_REPO: suxess-it/kubriX
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
      GIT_CONFIG_KEY_1: credential.https://github.com.helper
      GIT_CONFIG_VALUE_1: >-
        !f() { if [ "$1" = get ] && [ -n "$GIT_APP_TOKEN" ]; then printf 'username=x-access-token\npassword=%s\n' "$GIT_APP_TOKEN"; fi; }; f
    steps:
      - name: Create Prime sync token
        id: sync-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KUBRIX_CI_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUBRIX_CI_SYNC_APP_PRIVATE_KEY }}
          owner: suxess-it
          repositories: kubriX-prime
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: checkout and fetch upstream commits
        shell: bash
        env:
          SYNC_APP_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: |
          GIT_APP_TOKEN="$SYNC_APP_TOKEN" git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout main
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          
          # checkout latest release tag
          GIT_APP_TOKEN="" git fetch upstream --tags
          latestTag=$(git describe --tags "$(git rev-list --tags --max-count=1 --remotes upstream/main)")
          git switch -c from-upstream-release ${latestTag}
          
      - name: create PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token }}
          GIT_APP_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: |
          git remote -v
          git push --set-upstream origin from-upstream-release
          echo "new commits:"
          git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr)%Creset' --abbrev-commit --date=relative main..from-upstream-release
          # create a PR unless there are no new commits or there is already an existing PR from branch 'from-upstream-release'
          [ "$(git log main..from-upstream-release)" = "" ] || gh pr view from-upstream-release --repo ${GITHUB_REPOSITORY} --json state --jq '.state' | grep OPEN || gh pr create --base main --head from-upstream-release --repo ${GITHUB_REPOSITORY} --title "Updates from upstream release" --body ""

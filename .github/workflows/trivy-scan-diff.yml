name: trivy scan diff

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/trivy-scan-diff.yml'
      - '.github/install-trivy.sh'
      - '.github/create-trivy-scan-diff.sh'
      - '.github/trivy-scan-diff.py'
      - '.github/tests/test-trivy-scan-diff.py'
      - 'platform-apps/charts/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 0

      - name: Checkout Target of PR
        uses: actions/checkout@v7
        with:
          path: target
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: test trivy scan diff
        run: python3 pr/.github/tests/test-trivy-scan-diff.py

      - name: Set up Trivy
        run: bash pr/.github/install-trivy.sh

      - name: create trivy scan diff
        id: scan-diff
        shell: bash
        run: |
          bash pr/.github/create-trivy-scan-diff.sh

      - name: Update CVE labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              { name: "CVE critical fixed", flag: "CRITICAL_FIXED", color: "0e8a16", description: "PR removes at least one critical CVE in Trivy diff" },
              { name: "CVE high fixed", flag: "HIGH_FIXED", color: "fbca04", description: "PR removes at least one high CVE in Trivy diff" },
              { name: "CVE critical introduced", flag: "CRITICAL_INTRODUCED", color: "b60205", description: "PR introduces at least one critical CVE in Trivy diff" },
              { name: "CVE high introduced", flag: "HIGH_INTRODUCED", color: "d93f0b", description: "PR introduces at least one high CVE in Trivy diff" },
            ];
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const issue_number = context.issue.number;

            for (const label of labels) {
              if (process.env[label.flag] === "true") {
                try {
                  await github.rest.issues.getLabel({ ...repo, name: label.name });
                } catch (e) {
                  if (e.status !== 404) throw e;
                  await github.rest.issues.createLabel({ ...repo, name: label.name, color: label.color, description: label.description });
                }
                await github.rest.issues.addLabels({ ...repo, issue_number, labels: [label.name] });
                core.info(`Added label "${label.name}" to PR #${issue_number}`);
              } else {
                try {
                  await github.rest.issues.removeLabel({ ...repo, issue_number, name: label.name });
                  core.info(`Removed label "${label.name}" from PR #${issue_number}`);
                } catch (e) {
                  if (e.status !== 404) throw e;
                  core.info(`Label "${label.name}" not present on PR #${issue_number}`);
                }
              }
            }

      - name: PR comment default values with file
        if: env.CHANGES == 'true'
        uses: thollander/actions-comment-pull-request@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file-path: out/comment-diff-trivy-scan-result.txt
          comment-tag: trivy-scan-diff

      - name: Delete PR comment when charts no longer differ
        if: env.CHANGES != 'true'
        uses: thollander/actions-comment-pull-request@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          comment-tag: trivy-scan-diff
          mode: delete

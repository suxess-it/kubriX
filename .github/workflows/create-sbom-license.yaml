on:
  workflow_dispatch:

name: create sbom license

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1

      - name: create image lists
        shell: bash
        run: |
          bash .github/create-sbom-license.sh
          
      - name: commit image list
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add image-list
          git status
          echo "check diff and commit"
          git diff --cached --name-only --exit-code || git commit -m "update sbom and license list"
          git push

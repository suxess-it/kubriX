on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: pr number for kubrix-installer image
        type: string

name: test bootstrap

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository lifecycle token
        id: repo-create-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KUBRIX_CI_REPOS_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUBRIX_CI_REPOS_APP_PRIVATE_KEY }}
          owner: kubriX-demo
          permission-administration: write

      - name: create kubrix customer repo
        id: customer-repo
        shell: bash
        env:
          REPO_ORG: 'kubriX-demo'
          REPO_NAME: "kubrix-bootstrap-test-${{ github.run_id }}"
          GH_TOKEN: ${{ steps.repo-create-token.outputs.token }}
          VIS: "public"
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${REPO_ORG}/repos" \
            -f name="$REPO_NAME" \
            -f visibility="$VIS" \
            -f has_issues=true \
            -f has_wiki=false
          echo "Repo created: https://github.com/${REPO_ORG}/${REPO_NAME}"

      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubrix-cluster
          config: ${{ github.workspace }}/.github/kind-config.yaml
          
      - name: install mkcert
        shell: bash
        run: |
          curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
          chmod +x mkcert-v*-linux-amd64
          sudo cp mkcert-v*-linux-amd64 /usr/local/bin/mkcert

      - name: Create bootstrap repository token
        id: repo-bootstrap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KUBRIX_CI_REPOS_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUBRIX_CI_REPOS_APP_PRIVATE_KEY }}
          owner: kubriX-demo
          repositories: kubrix-bootstrap-test-${{ github.run_id }}
          permission-contents: write
          permission-workflows: write

      - name: Create Backstage repository token
        id: repo-backstage-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KUBRIX_CI_REPOS_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUBRIX_CI_REPOS_APP_PRIVATE_KEY }}
          owner: kubriX-demo
          permission-administration: write
          permission-contents: write
          permission-statuses: read
          permission-pull-requests: write
          permission-workflows: write

      - name: bootstrap kubrix
        shell: bash
        env:          
          KUBRIX_REPO: "https://github.com/kubriX-demo/kubrix-bootstrap-test-${{ github.run_id }}.git"
          KUBRIX_REPO_PASSWORD: ${{ steps.repo-bootstrap-token.outputs.token }}
          KUBRIX_UPSTREAM_REPO: "https://github.com/${{ github.repository }}"
          KUBRIX_UPSTREAM_REPO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          KUBRIX_BACKSTAGE_GITHUB_TOKEN: ${{ steps.repo-backstage-token.outputs.token }}
          KUBRIX_TARGET_TYPE: "kubrix-oss-stack"
          KUBRIX_DOMAIN: "127-0-0-1.nip.io"
          KUBRIX_DNS_PROVIDER: "none"
          KUBRIX_CLUSTER_TYPE: "kind"
          KUBRIX_UPSTREAM_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          kubectl create ns kubrix-install
          kubectl create secret generic kubrix-install-secrets -n kubrix-install \
            --from-literal KUBRIX_DOMAIN=${KUBRIX_DOMAIN} \
            --from-literal KUBRIX_DNS_PROVIDER=${KUBRIX_DNS_PROVIDER} \
            --from-literal KUBRIX_TARGET_TYPE=${KUBRIX_TARGET_TYPE} \
            --from-literal KUBRIX_CLUSTER_TYPE=${KUBRIX_CLUSTER_TYPE} \
            --from-literal KUBRIX_REPO_PASSWORD=${KUBRIX_REPO_PASSWORD} \
            --from-literal KUBRIX_UPSTREAM_REPO=${KUBRIX_UPSTREAM_REPO} \
            --from-literal KUBRIX_UPSTREAM_REPO_PASSWORD=${KUBRIX_UPSTREAM_REPO_PASSWORD} \
            --from-literal KUBRIX_BACKSTAGE_GITHUB_TOKEN=${KUBRIX_BACKSTAGE_GITHUB_TOKEN} \
            --from-literal KUBRIX_REPO=${KUBRIX_REPO} \
            --from-literal KUBRIX_UPSTREAM_BRANCH=${KUBRIX_UPSTREAM_BRANCH} \
            --from-literal KUBRIX_BOOTSTRAP=true \
            --from-literal KUBRIX_INSTALLER=true
          bash .github/install-kubriX-with-job.sh

      - name: Create final repository cleanup token
        if: ${{ always() && steps.customer-repo.outcome == 'success' }}
        id: repo-final-cleanup-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KUBRIX_CI_REPOS_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUBRIX_CI_REPOS_APP_PRIVATE_KEY }}
          owner: kubriX-demo
          repositories: kubrix-bootstrap-test-${{ github.run_id }}
          permission-administration: write

      - name: Delete bootstrap customer repo
        if: ${{ always() && steps.customer-repo.outcome == 'success' && steps.repo-final-cleanup-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.repo-final-cleanup-token.outputs.token }}
          REPO_NAME: kubrix-bootstrap-test-${{ github.run_id }}
        shell: bash
        run: |
          gh api --method DELETE "repos/kubriX-demo/${REPO_NAME}"

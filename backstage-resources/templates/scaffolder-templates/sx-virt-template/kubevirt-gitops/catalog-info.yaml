# apis
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{values.team}}-${{values.application_id}}-vm-api
  description: HTTP API for VM ${{values.team}}-${{values.application_id}}
spec:
  type: openapi
  lifecycle: production
  owner: "${{values.team}}"
  system: ${{values.application_id}}
  definition: |
    openapi: "3.0.0"
    info:
      version: 1.0.0
      title: VM HTTP API (${{values.application_id}})
      license:
        name: Apache 2.0
    servers:
      - url: http://${{values.team}}-${{values.application_id}}.${{values.domainName}}:8080
    paths:
      /:
        get:
          summary: VM service root
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: "${{values.team}}-${{values.application_id}}-prod"
  description: "${{values.team}}-${{values.application_id}}-prod"
  tags:
    - kubrix
    - template
    - metalstack
  annotations:
    github.com/project-slug: ${{values.repoUrlowner}}/${{values.repoUrlRepo}}
    backstage.io/kubernetes-id: ${{values.application_id}}
    kubecost.com/deployment-name: ${{values.application_id}}
    argocd/app-name: ${{values.team}}-${{values.application_id}}-prod
    argocd/app-namespace: adn-${{values.team}}
    backstage.io/kubernetes-namespace: ${{values.team}}-${{values.application_id}}-prod
    backstage.io/kubernetes-label-selector: app=${{values.application_id}}
    kubevirt-manager: "https://kubevirt-manager.${{values.domainName}}/"
    kargo-project: "https://kargo.${{values.domainName}}/project/${{values.team}}-${{values.application_id}}-kargo-project"
    backstage.io/techdocs-ref: dir:.
    grafana/dashboard-selector: "(tags @> 'kubevirt')"
    grafana/overview-dashboard: "https://grafana.${{values.domainName}}/d/k8s_views_ns/kubernetes-views-namespaces?orgId=1&refresh=30s&var-datasource=default&var-cluster=&var-namespace=adn-${{values.team}}-${{values.application_id}}-&var-resolution=30s&var-created_by=All"
spec:
  type: service
  lifecycle: prod
  owner: "${{values.team}}"
  system: ${{values.application_id}}
  dependsOn:
    - resource:argocd
    - resource:kubevirt
    - resource:kubecost
    - resource:k8s-monitoring
    - resource:kubevirt-manager
    - resource:kubevirt
    - resource:loki
    - resource:backstage
  subcomponentOf: ${{values.team}}-${{values.application_id}}
  providesApis:
    - ${{values.team}}-${{values.application_id}}-vm-api
---

{{ if and .Values.kyvernoPolicies.createResourceQuotaAndLimitrange.enabled .Values.kyvernoPolicies.useCelPolicies }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: add-ns-quota
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Add Quota
    policies.kyverno.io/category: Multi-Tenancy, EKS Best Practices
    policies.kyverno.io/subject: ResourceQuota, LimitRange
    policies.kyverno.io/description: >-
      To better control the number of resources that can be created in a given
      Namespace and provide default resource consumption limits for Pods,
      ResourceQuota and LimitRange resources are recommended.
      This policy will generate ResourceQuota and LimitRange resources when
      a new Namespace is created.
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["namespaces"]
  variables:
  - name: resourceQuota
    expression: >-
      {
        "apiVersion": dyn("v1"),
        "kind": dyn("ResourceQuota"),
        "metadata": dyn({
          "name": dyn("default-resourcequota"),
          "labels": dyn({"velero.io/exclude-from-backup": "true"})
        }),
        "spec": dyn({
          "hard": {
            "requests.cpu": "4",
            "requests.memory": "16Gi",
            "limits.cpu": "30",
            "limits.memory": "64Gi"
          }
        })
      }
  - name: limitRange
    expression: >-
      {
        "apiVersion": dyn("v1"),
        "kind": dyn("LimitRange"),
        "metadata": dyn({
          "name": dyn("default-limitrange"),
          "labels": dyn({"velero.io/exclude-from-backup": "true"})
        }),
        "spec": dyn({
          "limits": [{
            "type": dyn("Container"),
            "default": dyn({"cpu": "500m", "memory": "1Gi"}),
            "defaultRequest": dyn({"cpu": "200m", "memory": "256Mi"})
          }]
        })
      }
  generate:
  - expression: generator.Apply(object.metadata.name, [variables.resourceQuota, variables.limitRange])
{{- end }}

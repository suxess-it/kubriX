{{- if .Values.seaweedfs.enabled }}
{{- $cluster := .Values.seaweedfs.cluster }}
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: mimir
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: mimir
  seaweedRef:
    {{- toYaml $cluster | nindent 4 }}
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: mimir
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  identityRef:
    name: mimir
  seaweedRef:
    {{- toYaml $cluster | nindent 4 }}
  secretRef:
    name: mimir-s3-credentials
    accessKeyField: ACCESSKEYID
    secretKeyField: SECRETACCESSKEY

---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: mimir-rw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  seaweedRef:
    {{- toYaml $cluster | nindent 4 }}
  statements:
    - effect: Allow
      actions: ["s3:ListBucket", "s3:ListBucketMultipartUploads"]
      resources: ["mimir-blocks", "mimir-ruler", "mimir-alertmanager"]
    - effect: Allow
      actions: ["s3:GetObject", "s3:PutObject", "s3:PutObjectAcl", "s3:DeleteObject",
                "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
      resources: ["mimir-blocks/*", "mimir-ruler/*", "mimir-alertmanager/*"]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: mimir-rw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  seaweedRef:
    {{- toYaml $cluster | nindent 4 }}
  policyRef:
    name: mimir-rw
  subjects:
    - kind: S3Identity
      name: mimir

{{- range list "mimir-blocks" "mimir-ruler" "mimir-alertmanager" }}
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: {{ . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: {{ . }}
  clusterRef:
    {{- toYaml $cluster | nindent 4 }}
{{- end }}
{{- end }}

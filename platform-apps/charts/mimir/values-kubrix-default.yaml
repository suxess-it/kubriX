seaweedfs:
  enabled: true
  cluster:
    name: seaweedfs
    namespace: seaweedfs

mimir:
  # inject the S3 credentials generated by the seaweedfs operator (S3Credentials CR) into all mimir pods
  global:
    extraEnvFrom:
      - secretRef:
          name: mimir-s3-credentials

  gateway:
    enabledNonEnterprise: true
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        external-dns.alpha.kubernetes.io/ttl: "60"
        cert-manager.io/cluster-issuer: default-issuer
      hosts: []
      tls: []
  mimir:
    structuredConfig:
      common:
        storage:
          backend: s3
          s3:
            endpoint: seaweedfs-filer.seaweedfs.svc:8333
            insecure: true
            access_key_id: ${ACCESSKEYID}
            secret_access_key: ${SECRETACCESSKEY}
      blocks_storage:
        s3:
          bucket_name: mimir-blocks
      ruler_storage:
        s3:
          bucket_name: mimir-ruler
      alertmanager_storage:
        s3:
          bucket_name: mimir-alertmanager
      limits:
        compactor_blocks_retention_period: 30d
        max_global_series_per_user: 500000
        cardinality_analysis_enabled: true
  # continue to use classic arch (https://grafana.com/docs/helm-charts/mimir-distributed/latest/migration-guides/migrate-helm-chart-5.x-to-6.0/#continue-using-classic-architecture-disable-ingest-storage)
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
  kafka:
    enabled: false
  
  distributor:
    resources:
      limits:
        cpu: 3.5
        memory: 6Gi
  ingester:
    resources:
      limits:
        cpu: 5
        memory: 6Gi
    persistentVolume:
      size: 5Gi

  # storage is provided by seaweedfs
  minio:
    enabled: false

  metaMonitoring:
    grafanaAgent:
      enabled: false
    dashboards:
      enabled: true
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        grafana_folder: "kubriX"
    serviceMonitor:
      enabled: true

                items:
                  properties:
                    name:
                      type: string
                    secret:
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        optional:
                          type: boolean
                      type: object
                    value:
                      type: string
                  type: object
                type: array
              admin:

kubrix:
  keycloak:
    domainName: .127-0-0-1.nip.io

# demo users
    realm:
      realmid: kubrix
      users:
        - name: demoeditor
          firstName: demo
          lastName: editor
          email: "demoeditor@kubrix.io"
        - name: demoadmin
          firstName: demo
          lastName: admin
          email: "demoadmin@kubrix.io"
        - name: demoviewer
          firstName: demo
          lastName: viewer
          email: "demoviewer@kubrix.io"
      groups:
        - name: admins
          roles:
            - grafana-admin
            - vault-admin
          members:
            - demoadmin
        - name: viewers
          roles:
            - grafana-viewer
            - vault-viewer
          members:
            - demoviewer
        - name: editors
          roles:
            - grafana-editor
            - vault-editor
          members:
            - demoeditor
        - name: backstage-admin      # for service-account permission workaround
grafanaFolder: "kubriX"
seaweedfs:
  enabled: true
  cluster:
    name: seaweedfs
    namespace: seaweedfs

loki:
  # inject the S3 credentials generated by the seaweedfs operator (S3Credentials CR) into all loki pods
  defaults:
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

  loki:
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-chunks # not used in OSS mode, but required by the chart
      s3:
        endpoint: http://seaweedfs-filer.seaweedfs.svc:8333
        region: us-east-1
        accessKeyId: ${ACCESSKEYID}
        secretAccessKey: ${SECRETACCESSKEY}
        s3ForcePathStyle: true
        insecure: true
    commonConfig:
      replication_factor: 1 # since replicas is set to 1
    auth_enabled: false
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    ingester:
      chunk_encoding: snappy
    tracing:
      enabled: true
    querier:
      # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
      max_concurrent: 2
  
  gateway:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        external-dns.alpha.kubernetes.io/ttl: "60"
        cert-manager.io/cluster-issuer: default-issuer
      hosts: []
      tls: []

  deploymentMode: SimpleScalable

  backend:
    replicas: 1
  read:
    replicas: 1
  write:
    replicas: 1

  # Zero out replica counts of other deployment modes
  singleBinary:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0
  
  chunksCache:
    enabled: false
    # default is 500MB, with limited memory keep this smaller
    writebackSizeLimit: 10MB
    allocatedMemory: 2048

  resultsCache:
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 512Mi

  # Monitoring section determines which monitoring features to enable
  monitoring:
    # Dashboards for monitoring Loki
    dashboards:
      # -- If enabled, create configmap with dashboards for monitoring Loki
      enabled: true
      annotations:
        grafana_folder: "kubriX"
    # Recording rules for monitoring Loki, required for some dashboards
    rules:
      # -- If enabled, create PrometheusRule resource with Loki recording rules
      enabled: true
    # -- Include alerting rules
    alerts:
      enabled: true
    # ServiceMonitor configuration
    serviceMonitor:
      # -- If enabled, ServiceMonitor resources for Prometheus Operator are created
      enabled: true

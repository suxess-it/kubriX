default:
  valueFiles:
  - values-kubrix-default.yaml
  - values-cluster-kind.yaml
  - values-customer-generated.yaml
  - values-customer.yaml

applications:

  - name: prometheus-operator-crds
    annotations:
      argocd.argoproj.io/sync-wave: "-10"
    syncOptions:
      - ServerSideApply=true

  - name: traefik
    annotations:
      argocd.argoproj.io/sync-wave: "-10"

  - name: cert-manager
    annotations:
      argocd.argoproj.io/sync-wave: "-10"

  - name: crossplane
    annotations:
      argocd.argoproj.io/sync-wave: "-10"

  - name: argocd
    annotations:
      argocd.argoproj.io/sync-wave: "-9"
    syncOptions:
      - ServerSideApply=true

  - name: external-secrets
    annotations:
      argocd.argoproj.io/sync-wave: "-10"
    syncOptions:
      - ServerSideApply=true

  - name: k8s-monitoring
    annotations:
      argocd.argoproj.io/compare-options: ServerSideDiff=true
      argocd.argoproj.io/sync-wave: "-8"
    syncOptions:
      - ServerSideApply=true

  - name: openbao
    annotations:
      argocd.argoproj.io/sync-wave: "-8"

  - name: cnpg
    annotations:
      argocd.argoproj.io/compare-options: ServerSideDiff=true
      argocd.argoproj.io/sync-wave: "-10"
    syncOptions:
      - ServerSideApply=true

  - name: keycloak
    annotations:
      argocd.argoproj.io/sync-wave: "-5"
    ignoreDifferences:
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
        jqPathExpressions:
          - '.metadata.labels["app.kubernetes.io/version"]'
  - name: velero

  #- name: velero-ui

  - name: minio
     
  - name: kyverno
    syncOptions:
      - ServerSideApply=true

  - name: testkube
    annotations:
      argocd.argoproj.io/compare-options: ServerSideDiff=true
    syncOptions:
      - ServerSideApply=true
